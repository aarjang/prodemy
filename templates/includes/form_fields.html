{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">
    {% for error in form.non_field_errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}
  </div>
{% endif %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}"
           id="{{ field.id_for_label }}"
           class="form-control{% if field.errors %} is-invalid{% endif %}"
           {% if field.field.required %}required{% endif %}
           {% if field.field.widget.attrs.autocomplete %}autocomplete="{{ field.field.widget.attrs.autocomplete }}"{% endif %}
           {% if field.value and field.field.widget.input_type != 'password' %}value="{{ field.value }}"{% endif %}>
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
