{% extends "base.html" %}

{% block title %}ایمیل ارسال شد{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <h1 class="h4 mb-3">ایمیل ارسال شد</h1>
    <div class="alert alert-info" role="alert">
      اگر حسابی با این ایمیل وجود داشته باشد، پیوند بازیابی رمز به آن ارسال شد. صندوق ایمیل (و پوشه هرزنامه) را بررسی کنید.
    </div>
    <a href="{% url 'login' %}">بازگشت به صفحه ورود</a>
  </div>
</div>
{% endblock %}
