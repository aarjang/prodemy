{% extends "base.html" %}

{% block title %}بازیابی رمز عبور{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <section class="card bg-body-secondary border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">بازیابی رمز عبور</h1>
        <p class="small text-body-secondary">ایمیل حسابتان را وارد کنید تا پیوند تغییر رمز برایتان ارسال شود.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button type="submit" class="btn btn-primary w-100">ارسال پیوند بازیابی</button>
        </form>
      </div>
    </section>
  </div>
</div>
{% endblock %}
