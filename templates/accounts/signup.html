{% extends "base.html" %}

{% block title %}ثبت‌نام{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <section class="card bg-body-secondary border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">ثبت‌نام</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button type="submit" class="btn btn-primary w-100">ساخت حساب</button>
        </form>
        <p class="small mt-3 mb-0">حساب دارید؟ <a href="{% url 'login' %}">وارد شوید</a></p>
      </div>
    </section>
  </div>
</div>
{% endblock %}
